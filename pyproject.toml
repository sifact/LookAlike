[project]
name = "visual-search"
version = "0.1.0"
description = "Visual search: contrastive image embeddings, ANN retrieval and re-ranking"
readme = "README.md"
authors = [
    { name = "Moshiur Rahman Sifat", email = "sifatami596@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.9",
    "fastapi>=0.115",
    "huggingface-hub>=0.25",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.4",
    "pyarrow>=17",
    "python-multipart>=0.0.9",
    "timm>=1.0",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.66",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
azure = ["mlflow>=2.15", "azureml-mlflow>=1.57"]

[project.scripts]
visual-search = "visual_search.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
