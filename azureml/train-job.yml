# Trains the same model as locally: same data sample (seed 0, 300 products per
# category), same hyperparameters, then evaluates it against off-the-shelf DINOv2.
# The dataset is downloaded inside the job (fast cloud network); nothing large is uploaded.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: visual-search
display_name: train-interactions
description: Contrastive fine-tune of DINOv2 ViT-S on Stanford Online Products (same-product positives).

code: ..   # project root; .amlignore keeps data/, artifacts/, runs/, .venv/ out of the upload

environment:
  image: docker.io/pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime

compute: azureml:gpu-t4

environment_variables:
  VS_DATA: /tmp/vs-data          # local SSD on the node, not part of outputs
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

command: >-
  pip install -q -e ".[azure]" &&
  python -c "import torch; print('cuda', torch.cuda.is_available(), torch.cuda.get_device_name(0))" &&
  lookalike data --per-category-train 300 --per-category-test 300 --max-queries 2000 --seed 0 &&
  lookalike train --mode interactions --epochs 3 --batch-size 64 --lr 2e-5 --temperature 0.05 --proj-dim 256 --workers 4 --seed 0 &&
  lookalike evaluate vit_small_patch14_dinov2.lvd142m artifacts/models/interactions.pt &&
  mkdir -p outputs && cp -r artifacts/models runs outputs/
# Anything in ./outputs is saved with the job and downloadable afterwards.
